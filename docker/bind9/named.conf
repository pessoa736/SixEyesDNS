options {
    directory "/var/cache/named";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
    pid-file "/tmp/named.pid";
    session-keyfile "/tmp/session.key";
};

logging {
    channel query_log {
        file "/var/log/named/queries.log" versions 2 size 10m;
        print-time yes;
        print-category yes;
    };
    category queries { query_log; };
    category default { query_log; };
};

zone "test" {
    type master;
    file "/etc/bind/zones/db.test";
};

zone "30.172.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.172.30";
};
