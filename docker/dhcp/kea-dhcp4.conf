{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["eth0"]
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600,
      "persist": true,
      "name": "/var/log/kea/kea-leases4.csv"
    },
    "valid-lifetime": 600,
    "max-valid-lifetime": 900,
    "subnet4": [
      {
        "id": 1,
        "subnet": "172.30.0.0/24",
        "pools": [
          { "pool": "172.30.0.100 - 172.30.0.199" }
        ],
        "option-data": [
          { "name": "routers", "data": "172.30.0.1" },
          { "name": "domain-name-servers", "data": "172.30.0.4" },
          { "name": "domain-name", "data": "lab.test" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          { "output": "/var/log/kea/kea-dhcp4.log" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
