server:
    verbosity: 1
    interface: 0.0.0.0
    do-ip6: no
    access-control: 172.30.0.0/24 allow
    hide-identity: yes
    hide-version: yes
    logfile: "/var/log/unbound/unbound.log"
    log-queries: yes
    log-replies: yes

    # Zonas locais do laboratorio: encaminha para os autoritativos internos.
    # "nodefault" remove as zonas estaticas embutidas do unbound (RFC 6761/1918),
    # que responderiam NXDOMAIN sem consultar os autoritativos.
    local-zone: "test." nodefault
    local-zone: "30.172.in-addr.arpa." nodefault
    domain-insecure: "test."
    domain-insecure: "30.172.in-addr.arpa."

forward-zone:
    name: "test."
    forward-addr: 172.30.0.2
    forward-addr: 172.30.0.3
    forward-first: no

forward-zone:
    name: "30.172.in-addr.arpa."
    forward-addr: 172.30.0.3
    forward-first: no
