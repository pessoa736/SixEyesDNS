events {}

http {
    access_log /var/log/nginx/access.log;

    upstream catalog_api {
        server service-api:8081;
    }

    server {
        listen 80;
        server_name dashboard.sixeyes.test;

        location / {
            root /usr/share/nginx/html/dashboard;
            try_files $uri $uri/ /index.html;
        }

        location = /traffic_summary.json {
            alias /var/www/dashboard-data/traffic_summary.json;
            add_header Cache-Control "no-store";
        }

        location /api/ {
            proxy_pass http://catalog_api/;
        }
    }
}
