





services:

  dnsmasq:
    build: ./docker/dnsmasq
    volumes:
      - ./data/raw/dnsmasq:/var/log/dnsmasq
    ports:
      - "127.0.0.1:6767:53/udp"
      - "127.0.0.1:6767:53/tcp"
    restart: always
    networks:
      unlimited-void-net:
        ipv4_address: 172.30.0.2

  fake-services:
    build: ./docker/service-api
    environment:
      TRAFFIC_PATH: /data/dashboard/backend_traffic.json
    volumes:
      - ./data/raw:/data
    networks:
      unlimited-void-net:
        ipv4_address: 172.30.0.11

  backend-client:
    build: ./docker/backend-client
    depends_on:
      - fake-services
    environment:
      SERVICE_HOST: fake-services
      SERVICE_PORT: "8081"
      REQUEST_INTERVAL: "0.5"
      TRAFFIC_SEED: "42"
    networks:
      unlimited-void-net: null

  nginx:
    image: nginx:1.27.2-alpine
    depends_on:
      - fake-services
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/dashboard:/usr/share/nginx/html/dashboard:ro
      - ./data/raw/dashboard:/var/www/dashboard-data:ro
    networks:
      unlimited-void-net:
        ipv4_address: 172.30.0.10

  generator:
    build: ./docker/generator
    depends_on:
      - dnsmasq
    networks:
      unlimited-void-net: null
    environment:
      DNS_SERVER: dnsmasq
      DNS_PORT: "53"
      QUERY_COUNT: "50000"
      QUERY_INTERVAL: "0.01"
      SEED: "42"
      ANOMALY_RATE: "0.5"
      DASHBOARD_PATH: /data/dashboard/traffic_summary.json
    volumes:
      - ./data/raw:/data

networks:
  unlimited-void-net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
      